  <body>
    <header id="header"></header>

    <main>
      <p>
        I like using AI in many contexts and find it fascinating,but using it to
        write defeats my own sense for why writing is useful. All these articles
        are AI-free.
      </p>
      <h2>Blog</h2>
      <ul class="post-list">
        <li>
          <span class="post-date">2026-03-15</span>
          <a href="/blog/notes-from-my-first-pcb.html"
            >Notes from My First PCB</a
          >
        </li>
        <li>
          <span class="post-date">2026-03-01</span>
          <a href="/blog/integer-sequence-manipulation.html"
            >Integer Sequence Manipulation</a
          >
        </li>
      </ul>
    </main>

    <footer id="footer"></footer>

    <script>
      async function loadIncludes() {
        const includes = [
          { id: "header", file: "/header.html" },
          { id: "footer", file: "/footer.html" },
        ];
        for (const { id, file } of includes) {
          const res = await fetch(file);
          const html = await res.text();
          document.getElementById(id).outerHTML = html;
          if (id === "footer") {
            document.getElementById("currentYear").textContent =
              new Date().getFullYear();
          }
        }
      }
      loadIncludes();
    </script>
  </body>
