<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robotics Portfolio</title>
    <link rel="stylesheet" href="/css/index.css" />
    <link rel="stylesheet" href="/css/projects.css" />
  </head>

  <body>
    <header id="header"></header>

    <main>
      <h2>Robotics Portfolio</h2>
      <div class="gallery-container">
        <!-- YouTube Video Embed -->
        <figure class="gallery-item">
          <div style="text-align: center">
            <iframe
              width="560"
              height="315"
              src="https://www.youtube.com/embed/YIlImreQFTM"
              title="YouTube video player"
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen
            >
            </iframe>
          </div>
          <figcaption>
            A ultraviolet fungicidal system I worked on at Tortuga AgTech in
            2022.
          </figcaption>
        </figure>

        <figure class="gallery-item">
          <div style="text-align: center">
            <img
              src="../assets/particle-filter.gif"
              alt="Particle filter localization"
            />
          </div>
          <figcaption>
            Particle filter for robot localization.
          </figcaption>
        </figure>

        <figure class="gallery-item">
          <div style="text-align: center">
            <img
              src="../assets/uvc_enclosure.JPEG"
              alt="UVC bulb safety enclosure"
            />
          </div>
          <figcaption>
            A safety fixture for ultraviolet lightbulbs that I built at Tortuga
            AgTech (UVC light causes sunburn and eye damage). It uses a
            limitswitch to cut power if the PVC cover is removed. Interestingly
            I also had to add ventilation to this fixture because the lights
            heat up the PVC too much.
          </figcaption>
        </figure>
      </div>
    </main>

    <footer id="footer"></footer>

    <script>
      //header and footer loader
      async function loadIncludes() {
        const includes = [
          { id: "header", file: "/header.html" },
          { id: "footer", file: "/footer.html" },
        ];

        for (const { id, file } of includes) {
          const res = await fetch(file);
          const html = await res.text();
          document.getElementById(id).outerHTML = html;

          if (id === "footer") {
            document.getElementById("currentYear").textContent =
              new Date().getFullYear();
          }
        }
      }
      loadIncludes();
    </script>
  </body>
</html>
