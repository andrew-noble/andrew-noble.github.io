<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Andrew Noble</title>
    <link rel="stylesheet" href="/css/index.css" />
    <script
      data-goatcounter="https://andrewrn.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  </head>

  <body>
    <header id="header"></header>

    <main>
      <p>
        This is a place where I share impressions on books I've read. It's far
        from complete. A note: "rating" here is a measure of how much I
        recommend others read the book, so some books are solid without being
        something I think others should spend their time reading.
      </p>
      <div id="notes-placeholder"></div>
    </main>

    <footer id="footer"></footer>

    <script type="module">
      fetch("/html/book-note-snippets.html")
        .then((res) => res.text())
        .then((html) => {
          document.getElementById("notes-placeholder").innerHTML = html;
        });

      //header and footer loader
      async function loadIncludes() {
        const includes = [
          { id: "header", file: "/html/header.html" },
          { id: "footer", file: "/html/footer.html" },
        ];

        for (const { id, file } of includes) {
          const res = await fetch(file);
          const html = await res.text();
          document.getElementById(id).outerHTML = html;

          if (id === "footer") {
            document.getElementById("currentYear").textContent =
              new Date().getFullYear();
          }
        }
      }
      loadIncludes();
    </script>
  </body>
</html>
